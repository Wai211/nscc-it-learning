<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Anthony!</title>
    <style>
        /* 全局样式重置与背景设定 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 主卡片样式 */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 10;
            animation: popIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .highlight {
            background: linear-gradient(45deg, #ff7675, #fdcb6e, #55efc4, #00cec9);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 4s ease infinite;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #dfe6e9;
            font-weight: 300;
        }

        .icon {
            font-size: 4rem;
            margin-top: 20px;
            display: inline-block;
            animation: pulse 1.5s infinite alternate;
        }

        /* 卡片弹出与渐变动画 */
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.6) translateY(50px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15) rotate(5deg); }
        }

        /* 纯 CSS 撒花（Confetti）特效 */
        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 18px;
            top: -20px;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        /* 彩带飘落与旋转动画 */
        @keyframes fall {
            0% {
                top: -10%;
                transform: translateX(0) rotate(0deg);
            }
            100% {
                top: 105%;
                transform: translateX(100px) rotate(720deg);
            }
        }

        /* 随机分布不同位置、颜色、大小与下落速度的彩带粒子 */
        .confetti:nth-child(1)  { left: 5%;  background: #ff7675; animation-duration: 4s;   animation-delay: 0s;   }
        .confetti:nth-child(2)  { left: 12%; background: #fdcb6e; animation-duration: 3.2s; animation-delay: 1.2s; }
        .confetti:nth-child(3)  { left: 20%; background: #e84393; animation-duration: 4.5s; animation-delay: 0.5s; width: 8px; height: 12px; }
        .confetti:nth-child(4)  { left: 28%; background: #00cec9; animation-duration: 3.8s; animation-delay: 2s;   }
        .confetti:nth-child(5)  { left: 35%; background: #55efc4; animation-duration: 4.2s; animation-delay: 0.8s; }
        .confetti:nth-child(6)  { left: 42%; background: #a29bfe; animation-duration: 3.5s; animation-delay: 1.5s; width: 15px; height: 22px; }
        .confetti:nth-child(7)  { left: 50%; background: #ffeaa7; animation-duration: 4.8s; animation-delay: 0.2s; }
        .confetti:nth-child(8)  { left: 58%; background: #ff7675; animation-duration: 3.1s; animation-delay: 1.8s; }
        .confetti:nth-child(9)  { left: 65%; background: #74b9ff; animation-duration: 4.1s; animation-delay: 0.6s; width: 10px; height: 14px; }
        .confetti:nth-child(10) { left: 73%; background: #fd79a8; animation-duration: 3.7s; animation-delay: 2.2s; }
        .confetti:nth-child(11) { left: 80%; background: #55efc4; animation-duration: 4.6s; animation-delay: 0.9s; }
        .confetti:nth-child(12) { left: 88%; background: #fdcb6e; animation-duration: 3.3s; animation-delay: 1.1s; }
        .confetti:nth-child(13) { left: 95%; background: #a29bfe; animation-duration: 4.0s; animation-delay: 0.3s; }

        /* 复制多一组错开时间，让撒花更密集 */
        .confetti:nth-child(14) { left: 8%;  background: #00cec9; animation-duration: 3.6s; animation-delay: 2.5s; }
        .confetti:nth-child(15) { left: 25%; background: #ff7675; animation-duration: 4.4s; animation-delay: 3.1s; }
        .confetti:nth-child(16) { left: 48%; background: #fdcb6e; animation-duration: 3.9s; animation-delay: 2.7s; }
        .confetti:nth-child(17) { left: 68%; background: #e84393; animation-duration: 4.3s; animation-delay: 3.3s; }
        .confetti:nth-child(18) { left: 85%; background: #74b9ff; animation-duration: 3.4s; animation-delay: 2.8s; }
    </style>
</head>
<body>

    <!-- 撒花特效容器 -->
    <div class="confetti-container">
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
    </div>

    <!-- 祝贺卡片主体 -->
    <div class="card">
        <h1 class="title">Happy Birthday, <span class="highlight">Anthony</span>!</h1>
        <p class="subtitle">Wishing you a wonderful day and a fantastic year ahead! ✨</p>
        <div class="icon">🎂🎉🥳</div>
    </div>

</body>
</html>
